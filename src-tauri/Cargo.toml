[package]
name = "mdnaonao"
version = "0.1.0"
description = "MDNaonao —— Windows 轻量 Markdown 查看器（严格只读）"
authors = ["MDNaonao Contributors"]
edition = "2021"
rust-version = "1.77"
default-run = "mdnaonao"

# 二进制入口为 src/main.rs（Builder 链所在处）；业务模块统一放在 lib 中，
# 便于单元测试与未来复用。Windows 专用项目，crate-type 只需 rlib。
[lib]
name = "mdnaonao_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# —— 桌面壳与官方插件（DG 4.1「官方现成能力优先」）——
# protocol-asset：查看态本地图片加载的候选方案之一（asset 协议 vs Rust 读文件转 data URL，
# 二选一在 M0-② 定案，见 DG 8「查看态本地图片」）。必须与 tauri.conf.json 的
# app.security.assetProtocol.enable 保持一致，否则 tauri-build 会在编译期报 allowlist 不匹配。
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-cli = "2"
tauri-plugin-clipboard-manager = "2"

# —— 序列化 ——
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# —— 错误与日志（AI_DEV_GUIDE 第 5 节 Rust 规范）——
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# —— 命令行（--action 解析，cli 插件与单实例回调共用，DG 7.4）——
clap = { version = "4", features = ["derive"] }

# —— 系统集成 ——
# notify：当前文件监听（DG 7.2-3 防抖 300ms 重渲染）
notify = "6"
# winreg：**仅**用于额外右键动词与「当前默认程序是谁」只读检测。
# 红线 2/3：永不写 UserChoice，永不整删 .md 扩展名键；文件关联本身交给 bundler。
winreg = "0.52"
# reqwest：飞书 medias/upload_all + import_tasks 两个接口（DG 4.1 飞书 SDK 行）
reqwest = { version = "0.12", features = ["json", "multipart"] }

# —— M0-① 的 COM 依赖（红线 10）——
# PrintToPdf / CDP 需要 `webview2-com` 与 `windows`，版本必须与 Tauri 内部 wry
# 锁定的版本**精确一致**，永不单独升级。
#
# 已于 2026-08-17 用 `cargo tree -i` 核对（tauri 2.11.5 环境）：
#   wry v0.55.1 → webview2-com v0.38.2、windows v0.61.3
# 升级 tauri 后必须重新核对这三个版本并同步此处。
# M0-① PoC 脚手架用（M2 打印模板落地后，若 lib.rs 的 PoC 入口删除则一并复查）：
# url —— file:// URL 构造；tokio —— 等待页面渲染的 sleep。二者本就是 tauri 的传递依赖，
# 此处显式声明只是为了能直接 use（版本跟随 lockfile 已解析的结果）。
url = "2"
tokio = { version = "1", features = ["time"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = [
  "Win32_Foundation",
  "Win32_System_Com",
] }
windows-core = "=0.61.2"

[profile.release]
# 25MB 安装包预算（DG 3.2）：体积优先
opt-level = "s"
lto = true
codegen-units = 1
strip = true
incremental = false
